<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivid Transcript Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div>
            <p class="eyebrow">AI transcription</p>
            <h1>Vivid Transcript Studio</h1>
          </div>
        </div>
      </header>

      <main class="app-grid">
        <section class="panel upload-panel">
          <div class="panel-header">
            <span class="badge">Upload</span>
            <h2>Convert MP4 to transcript</h2>
          </div>

          <form id="upload-form" class="upload-form">
            <div id="dropzone" class="dropzone" tabindex="0" aria-label="Upload MP4 file">
              <div class="drop-icon">⬆</div>
              <strong>Drop your MP4 here</strong>
              <span>or click to browse</span>
            </div>
            <input id="file-input" class="hidden-input" type="file" accept="video/mp4,.mp4" />

            <div class="field-group">
              <label for="mode">Output mode</label>
              <select id="mode" name="mode">
                <option value="formal">Formal / Legal</option>
                <option value="academic">Academic / Student</option>
              </select>
            </div>

            <div class="field-group">
              <label for="language">Transcript language</label>
              <select id="language" name="language">
                <option value="English">English</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Arabic">Arabic</option>
                <option value="Hebrew">Hebrew</option>
                <option value="Hindi">Hindi</option>
                <option value="Japanese">Japanese</option>
                <option value="Chinese">Chinese</option>
              </select>
            </div>

            <button id="submit-btn" type="submit" class="primary-btn">Generate transcript</button>
          </form>

          <div id="status" class="status-box hidden" aria-live="polite">
            <div class="progress-bar-track">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="status-text">Waiting for file</p>
          </div>

          <div id="error-box" class="error-box hidden"></div>
        </section>

        <section class="panel output-panel">
          <div class="output-header">
            <div>
              <span class="badge neutral">Result</span>
              <h2>Transcript</h2>
            </div>
            <div class="download-actions">
              <button id="tts-btn" class="secondary-btn hidden" type="button">Listen to transcript</button>
              <button id="download-txt" class="secondary-btn hidden" type="button">Download .TXT</button>
              <button id="download-docx" class="secondary-btn hidden" type="button">Download .DOCX</button>
            </div>
          </div>

          <div id="tts-control" class="tts-control hidden">
            <div class="tts-header">
              <h3>Speech playback</h3>
              <span id="tts-status">Ready</span>
            </div>
            <div id="tts-timeline" class="tts-timeline"></div>
          </div>

          <div class="result-layout">
            <pre id="result-box" class="result-box">Your transcript will appear here.</pre>

            <aside class="timeline-panel">
              <div class="timeline-header">
                <h3>Timeline</h3>
                <span>Key sections</span>
              </div>
              <div id="timeline" class="timeline-list">
                <div class="timeline-empty">Your transcript sections will appear here.</div>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
